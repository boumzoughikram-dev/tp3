<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations de la résidence</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Titre -->
    <header class="page-header py-4">
        <div class="container">
            <h1 class="fw-bold mb-1">Locations de la résidence</h1>
            <p class="mb-0">
                Appartements et villas loués par jour ou par semaine
            </p>
        </div>
    </header>

    <main class="container py-4">

        <!-- Indicateurs -->
       <section class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-box">
                    <div class="text-muted">Clients</div>
                    <div id="statCustomers" class="value">–</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-box">
                    <div class="text-muted">Produits</div>
                    <div id="statProducts" class="value">–</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-box">
                    <div class="text-muted">Locations</div>
                    <div id="statOrders" class="value">–</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-box">
                    <div class="text-muted">Montant cumulé</div>
                    <div id="statRevenue" class="value">–</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-box">
                    <div class="text-muted">Locations affichées</div>
                    <div id="statVisibleOrders" class="value">–</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-box">
                    <div class="text-muted">Montant affiché</div>
                    <div id="statVisibleRevenue" class="value">–</div>
                </div>
            </div>
        </section>

        <!-- Recherche -->
        <section class="mb-3">
            <label for="searchInput" class="form-label fw-semibold">
                Rechercher par nom de client ou un logement
            </label>
            <input type="text" id="searchInput" class="form-control"
                   placeholder="Exemple : Sara ou Villa V1">
        </section>

        <!-- Filtres -->
        <section class="mb-3">
            <p class="fw-semibold mb-2">Catégorie de produit</p>
            <div id="categoryBar" class="d-flex flex-wrap gap-2 mb-3"></div>

            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="statusSelect" class="form-label fw-semibold">
                        Statut de la location
                    </label>
                    <select id="statusSelect" class="form-select">
                        <option value="all">Tous</option>
                        <option value="Livree">Livrée</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulee">Annulée</option>
                    </select>
                    </div>
            </div>
        </section>

        <!-- Messages -->
        <p id="resultCount" class="text-muted">Chargement...</p>
        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <!-- Zone principale : tableau généré par JavaScript -->
       <section class="table-responsive">
            <table class="table align-middle bg-white">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Client</th>
                        <th>Ville</th>
                        <th>Date</th>
                        <th>Produits</th>
                        <th>Total</th>
                        <th>Statut</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="rentalsTableBody">
                    <!-- Généré avec JavaScript -->
                </tbody>
            </table>
        </section>

    </main>

    <!-- Fenêtre de détail -->
    <div class="modal fade" id="rentalModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle" class="modal-title fs-5"></h2>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>
                <div id="modalBody" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    <script type="module" src="js/app.js"></script>

</body>
</html>
